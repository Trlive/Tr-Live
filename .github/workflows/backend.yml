name: Backend
on:
  push:
  pull_request:
# İş akışı depoyu yalnızca okur (en az yetki).
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run check
      - run: npm test
      # Bilinen güvenlik açığı olan paket var mı (bilgi amaçlı; derlemeyi durdurmaz, özet sayfasında görünür).
      - name: Paket güvenlik taraması
        if: matrix.node == 20
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee audit.log || {
            { echo "### ⚠️ Sunucu paketlerinde bilinen güvenlik açığı"; echo '```'; tail -n 40 audit.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

  e2e:
    # Gerçek PostgreSQL + gerçek sunucu süreci ile uçtan uca testler (SQL doğrulaması burada yapılır)
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trlive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trlive_test
