name: Mobile
on:
  push:
  pull_request:
# İş akışı depoyu yalnızca okur (en az yetki).
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - name: Sürüm tutarlılığı (pubspec ↔ lib/version.dart)
        run: |
          P="$(grep -E '^version:' pubspec.yaml | sed -E 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          V="$(grep -oE "kAppVersion = '[0-9]+\.[0-9]+\.[0-9]+'" lib/version.dart | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          echo "pubspec: $P · version.dart: $V"
          if [ "$P" != "$V" ]; then echo "::error::lib/version.dart ($V) pubspec.yaml sürümüyle ($P) aynı olmalı"; exit 1; fi
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
