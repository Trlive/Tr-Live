<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Wild King Slot</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="game.css">
</head>
<body>
<div id="stage">
 <canvas id="bg" width="1080" height="2040"></canvas>
 <button class="hb" id="bRules" aria-label="Kurallar"><svg viewBox="0 0 24 24"><text x="12" y="18.5" text-anchor="middle" font-size="19" font-weight="900" fill="#ffd84a" font-family="Arial">?</text></svg></button>
 <button class="hb" id="bHist" aria-label="Geçmiş"><svg viewBox="0 0 24 24" fill="none" stroke="#ffd84a" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="3.5" width="12" height="16" rx="2"/><path d="M8 8h6M8 11.5h6M8 15h3"/><circle cx="17.5" cy="17.5" r="4" fill="#111"/><path d="M17.5 15.6v2l1.3 1"/></svg></button>
 <canvas id="logo" width="600" height="168"></canvas>
 <button class="hb" id="bSet" aria-label="Ayarlar"><svg viewBox="0 0 24 24" fill="none" stroke="#ffd84a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></button>
 <div id="tick"><div id="tickIn"></div></div>
 <button id="crazy"><img id="crazyImg" alt=""><b id="crazyN">x0</b><small>Çılgın Slot</small></button>
 <div id="jpbar">
  <div class="pan"></div><div class="ctr"></div>
  <canvas id="jpTitle" width="360" height="112"></canvas>
  <div id="vTot" class="num">0</div>
  <div class="jrow" id="rCol"><span class="tl c">colossal</span><span class="v num" id="vCol">0</span></div>
  <div class="jrow" id="rBig"><span class="tl b">big</span><span class="v num" id="vBig">0</span></div>
  <div class="jrow" id="rMega"><span class="v num" id="vMega">0</span><span class="tl m">mega</span></div>
  <div class="jrow" id="rMini"><span class="v num" id="vMini">0</span><span class="tl n">mini</span></div>
 </div>
 <div id="prog"><div id="progf"></div><div id="progt">0/20</div></div>
 <div id="progi"><img id="progImg" alt=""></div>
 <canvas id="rail" width="1080" height="48"></canvas>
 <div id="rframe"><div id="reels"></div></div>
 <svg id="lines" viewBox="0 0 520 384"></svg>
 <div id="fbanner"><canvas id="fbc" width="320" height="68"></canvas></div>
 <div id="plaque"><div class="bg"><div class="stars"></div></div><div class="odo num" id="plOdo"></div><button id="gbtn">×2</button></div>
 <div id="panel">
  <div class="lab" id="lLines">LINES<b>50</b></div>
  <div class="lab" id="lTot">TOTAL BET<b class="num" id="tbv">0</b></div>
  <div class="lab" id="lWin">WIN<b class="num" id="winv">0</b></div>
  <button id="turbo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>TURBO</button>
  <div id="betbox"><button class="pm" id="bMinus">−</button><div id="betv">BET<b class="num" id="betn">0</b></div><button class="pm" id="bPlus">+</button></div>
  <button id="auto">AUTO</button>
  <button id="spin"><canvas id="spinTxt" width="232" height="120"></canvas></button>
  <div id="bal"><img id="coinImg" alt=""><span id="balv" class="num">0</span><i>›</i></div>
  <button id="max">MAX</button>
  <div id="sess" class="num"></div>
 </div>
 <div id="sinfo"><img id="siImg" alt=""><div class="t" id="siTxt"></div></div>

 <div id="notif"><div class="nb"></div><div class="na" id="nAv"></div><img id="nImg" alt=""><div class="nn" id="nName"></div><div class="nt" id="nTxt"></div><div class="nv num" id="nVal"></div></div>

 <div class="ov" id="ovFree"><div class="dark"></div><div class="rays"></div><canvas class="ttl" id="freeC" width="560" height="520" style="width:280px;height:260px"></canvas></div>
 <div class="ov" id="ovFreeEnd"><div class="dark"></div><div class="rays"></div><canvas class="ttl" id="freeEC" width="640" height="300" style="width:320px;height:150px"></canvas><div class="amtbar green"><div class="odo num" id="feOdo"></div></div><div class="sub">Free spin toplam kazancı</div><div class="tap">Geçmek için dokun</div></div>
 <div class="ov" id="ovBig"><div class="dark"></div><div class="rays"></div><canvas class="ttl" id="bigC" width="900" height="300" style="width:450px;height:150px"></canvas><div class="amtbar red"><div class="odo num" id="bigOdo"></div></div><div class="tap">Geçmek için dokun</div></div>
 <div class="ov" id="ovJp"><div class="dark"></div><div class="rays"></div><canvas class="ttl" id="jpC" width="900" height="420" style="width:450px;height:210px"></canvas><div class="amtbar red"><div class="odo num" id="jpOdo"></div></div><div class="sub" id="jpSub"></div><div class="tap">Geçmek için dokun</div></div>
 <div class="ov" id="crz"><div class="dark"></div><div class="box"><h3>ÇILGIN SLOT</h3><div class="inf"><span>ŞANS <b id="crzL">3</b></span><span>BAZ <b id="crzB">0</b></span><span>KAZANÇ <b id="crzW">0</b></span></div><div id="crzReels"></div><button id="crzBtn">ÇEVİR</button><div id="crzMsg"></div></div></div>
 <div class="ov" id="gmb"><div class="dark"></div><div class="box"><h3>KART KUMARI</h3><div class="inf"><span>KAZANÇ<b id="gAmt" class="num">0</b></span><span>KIRMIZI/SİYAH<b id="gNext" class="num">0</b></span><span>TUR<b id="gRound">0/5</b></span></div><div id="gcard"><canvas id="gcv" width="300" height="420"></canvas></div><div id="ghist"></div><div class="gbtns"><button id="gRed">KIRMIZI</button><button id="gBlack">SİYAH</button></div><button id="gTake">TOPLA</button><div id="gMsg"></div></div></div>
 <canvas id="fx" width="1080" height="2000"></canvas>

 <div class="md" id="rules"><div class="pn"><div class="hd"><canvas id="hdC1" width="980" height="168"></canvas><h2>Kurallar</h2></div><button class="x">×</button><div class="bd" id="rulesB"></div></div></div>
 <div class="md" id="hist"><div class="pn"><div class="hd"><canvas id="hdC2" width="980" height="168"></canvas><h2>Oyun geçmişi</h2></div><button class="x">×</button><div class="bd" id="histB"></div></div></div>
 <div class="md" id="jpm"><div class="pn"><div class="hd"><canvas id="hdC3" width="980" height="168"></canvas><h2>Jackpot ×5</h2></div><button class="x">×</button><div class="bd" id="jpB"></div></div></div>
 <div class="md" id="setm"><div class="pn" style="width:440px"><div class="hd"><canvas id="hdC4" width="880" height="168" style="width:440px"></canvas><h2>Ayarlar</h2></div><button class="x">×</button><div class="bd" id="setB"></div></div></div>
 <div class="md" id="autom"><div class="pn" style="width:460px"><div class="hd"><canvas id="hdC5" width="920" height="168" style="width:460px"></canvas><h2>Otomatik Oyun</h2></div><button class="x">×</button><div class="bd" id="autoB"></div></div></div>
 <div class="toast" id="toast"></div>
 <div id="loader"><canvas id="ldLogo" width="720" height="200"></canvas><div id="ldbar"><div id="ldf"></div></div><div id="ldt">Yükleniyor…</div></div>
</div>

<script src="game.js"></script>
</body>
</html>
