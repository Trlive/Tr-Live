<!doctype html>
<html lang="__LANG__"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Ludo</title>
<style nonce="__NONCE__">
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0906;color:#f6efdf;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:root{--gold:#f2b92a;--gold2:#ffd54f;--line:#4d3c1c;--surf:#17130c;--surf2:#221b10;--dim:#b3a584}
#app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(130% 70% at 50% 30%,#33260f 0%,#17110a 52%,#0b0906 100%)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.6px 1.6px at 12% 14%,#fff9 50%,#0000 52%),radial-gradient(1px 1px at 78% 9%,#fff7 50%,#0000 52%),radial-gradient(1.6px 1.6px at 40% 72%,#ffe9a899 50%,#0000 52%),radial-gradient(1px 1px at 90% 58%,#fff6 50%,#0000 52%),radial-gradient(1px 1px at 22% 90%,#fff6 50%,#0000 52%),radial-gradient(1.6px 1.6px at 64% 38%,#ffe9a877 50%,#0000 52%),radial-gradient(1px 1px at 52% 6%,#fff6 50%,#0000 52%);animation:tw 3.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.45}to{opacity:1}}
#app>*{position:relative}
.scr{display:none;flex:1;min-height:0;flex-direction:column}.scr.on{display:flex}
/* ---------- üst çubuk ---------- */
.bar{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:12px;background:linear-gradient(180deg,rgba(255,213,79,.16),rgba(0,0,0,.4));border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--gold2)}
.sp{flex:1}
.ib{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold2)}
.ib svg{width:16px;height:16px}
.ib:active{background:var(--surf2)}
/* ---------- bekleme ---------- */
#lobby{align-items:center;padding:0 16px 14px;text-align:center;overflow-y:auto}
.logoimg{width:84px;height:84px;flex:none;margin-top:0;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6));animation:float 3.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px) rotate(-2deg)}}
.logo{font-weight:900;font-size:30px;letter-spacing:6px;line-height:1;margin:6px 0 2px;background:linear-gradient(180deg,#fff0b3,#f2b92a 55%,#b9770a);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:10px;letter-spacing:3px;color:var(--dim);-webkit-text-fill-color:var(--dim);font-weight:600;margin-top:4px}
#lmsg{font-size:15px;font-weight:700;margin:10px 0 2px}
#lcount{color:var(--gold2);font-size:13px;min-height:18px}
.slots{display:flex;justify-content:center;gap:10px;margin:12px 0;max-width:420px}
.slot{width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--dim)}
.slot .av{width:54px;height:54px;font-size:21px;border:3px solid var(--c);box-shadow:0 0 12px -2px var(--c)}
.slot.empty .av{background:rgba(255,255,255,.04);border:2px dashed rgba(255,255,255,.25);box-shadow:none;color:rgba(255,255,255,.35);animation:blink 1.6s ease-in-out infinite}
.slot span{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes blink{50%{opacity:.45}}
.btns{display:flex;gap:10px;width:100%;max-width:420px;margin-top:auto}
.btn{flex:1;height:46px;border-radius:23px;font-weight:800;font-size:15px;background:linear-gradient(180deg,#ffe27a,#f2b92a 55%,#c98a08);color:#1c1405;display:flex;align-items:center;justify-content:center;padding:0 12px;box-shadow:0 3px 0 #8a5a05,0 6px 14px rgba(0,0,0,.45)}
.btn.alt{background:var(--surf2);color:#f6efdf;border:1px solid var(--line);box-shadow:0 3px 0 #0b0906}
.btn.red{background:#3a1512;color:#ff9b93;border:1px solid #6b2a24;box-shadow:none}
.btn:disabled{opacity:.4}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #8a5a05}
.link{margin-top:10px;color:var(--dim);font-size:12px;text-decoration:underline;padding:4px 8px}
/* ---------- avatar ---------- */
.av{position:relative;width:44px;height:44px;border-radius:50%;background:#3a2c12;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--gold2);flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
/* ---------- modlar ---------- */
.modes{display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px;margin:8px 0}
.mode{display:flex;align-items:center;gap:10px;text-align:start;padding:10px 12px;border-radius:16px;background:linear-gradient(135deg,#1d160b,#120e07);border:1.5px solid var(--line);transition:transform .15s}
.mode:active{transform:scale(.98)}
.mode.on{border-color:var(--gold);background:linear-gradient(135deg,#33260f,#17110a);box-shadow:0 0 16px -4px var(--gold)}
.mode i{font-style:normal;font-size:24px;width:40px;height:40px;border-radius:12px;background:radial-gradient(circle at 35% 30%,#4a3814,#1d1509);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.mode b{display:block;font-size:14px}.mode small{color:var(--dim);font-size:11.5px;line-height:1.3}
/* ---------- oyun ---------- */
#board{align-items:center}
#pl{flex:none;display:flex;justify-content:center;gap:6px;padding:0 6px 4px;width:100%;height:50px}
.pc{flex:1;max-width:92px;min-width:0;display:flex;align-items:center;gap:5px;padding:3px 5px 3px 3px;border-radius:22px;background:rgba(0,0,0,.38);border:1.5px solid rgba(255,255,255,.08);position:relative;transition:transform .25s,background .25s,border-color .25s}
.pc .rg{flex:none;width:34px;height:34px;border-radius:50%;padding:3px;background:conic-gradient(var(--c) calc(var(--p,1)*360deg),rgba(255,255,255,.14) 0)}
.pc .av{width:100%;height:100%;font-size:14px;border:0;background:#2b210f}
.pc .tx{min-width:0;display:flex;flex-direction:column;gap:3px;flex:1}
.pc .nm{font-size:10px;line-height:1;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pc .dots{display:flex;gap:3px}
.pc .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18)}
.pc .dots i.on{background:var(--c);border-color:#fff;box-shadow:0 0 5px var(--c)}
.pc.turn{transform:translateY(-1px) scale(1.05);background:linear-gradient(180deg,rgba(255,213,79,.2),rgba(0,0,0,.45));border-color:var(--c);box-shadow:0 0 14px -2px var(--c);animation:glow 1.2s ease-in-out infinite alternate}
.pc.turn .nm{color:#fff;font-weight:800}
@keyframes glow{to{box-shadow:0 0 20px 1px var(--c)}}
.pc .bd{position:absolute;right:2px;top:-6px;font-size:13px}
.pc .kl{position:absolute;right:6px;bottom:-5px;font-size:9px;padding:0 5px;border-radius:7px;background:#0b0906;border:1px solid var(--line);color:var(--gold2)}
.s0{--c:#e5483d}.s1{--c:#2fbf71}.s2{--c:#f2b92a}.s3{--c:#3d8bfd}
#bwrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:0 8px}
#stage{position:relative}
#bd{position:absolute;inset:0;border-radius:14px;overflow:hidden;background:#20170b;box-shadow:0 0 0 3px #7a4f06,0 0 0 6px var(--gold),0 0 0 8px #3b2704,0 12px 30px rgba(0,0,0,.7);transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
#bd svg.bs{position:absolute;inset:0;width:100%;height:100%;display:block}
.it{position:absolute;width:6.6667%;height:6.6667%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.it span{display:flex;align-items:center;justify-content:center;width:86%;height:86%;border-radius:50%;font-size:var(--fs,14px);line-height:1;background:radial-gradient(circle at 35% 30%,#fff,#ffe6a8 70%);box-shadow:0 0 0 1.5px #c98a08,0 0 9px rgba(242,185,42,.95);animation:itf 1.8s ease-in-out infinite}
@keyframes itf{50%{transform:translateY(-8%) scale(1.07)}}
.tk{position:absolute;width:6.4%;height:6.4%;margin:-3.2% 0 0 -3.2%;padding:0;z-index:3;transition:left .12s linear,top .12s linear}
.tk .un{display:block;width:100%;height:100%;transform:rotate(var(--un,0deg))}
.tk svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.55))}
.tk.ok{z-index:6}
.tk.ok svg{animation:tkp .7s ease-in-out infinite;filter:drop-shadow(0 0 5px #ffd54f) drop-shadow(0 0 9px #ffd54f)}
@keyframes tkp{50%{transform:translateY(-14%) scale(1.2)}}
.gh{position:absolute;width:6.4%;height:6.4%;margin:-3.2% 0 0 -3.2%;border-radius:50%;border:2.5px dashed var(--c);background:rgba(255,255,255,.22);z-index:2;padding:0;animation:gh 1s ease-in-out infinite}
@keyframes gh{50%{transform:scale(1.25);background:rgba(255,255,255,.45)}}
.pf{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;pointer-events:none;z-index:8}
.rp{position:absolute;width:6.4%;height:6.4%;margin:-3.2% 0 0 -3.2%;border-radius:50%;border:3px solid #fff;pointer-events:none;z-index:7}
.pt{position:absolute;z-index:9;pointer-events:none;font-size:var(--fs2,22px);line-height:1;transform:translate(-50%,-50%)}
#ctl{flex:none;width:100%;display:flex;align-items:center;justify-content:center;gap:16px;min-height:72px;padding:6px 12px}
#dice{width:56px;height:56px;perspective:300px;padding:0;flex:none;border-radius:14px}
#dice .tilt{width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(-22deg) rotateY(-26deg)}
#dice .cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.15,.85,.25,1)}
#dice .f{position:absolute;inset:0;border-radius:13px;background:linear-gradient(145deg,#fff,#e6dabb);border:2px solid var(--dc,#c98a08);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px;backface-visibility:hidden;box-shadow:inset 0 0 8px rgba(0,0,0,.18)}
#dice .f b{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#555,#111 70%);transform:scale(.0)}
#dice .f b.on{transform:scale(.82);background:radial-gradient(circle at 35% 30%,var(--dc,#e5483d),#2a0c08 130%)}
#dice .f1{transform:translateZ(28px)}#dice .f6{transform:rotateY(180deg) translateZ(28px)}
#dice .f2{transform:rotateY(90deg) translateZ(28px)}#dice .f5{transform:rotateY(-90deg) translateZ(28px)}
#dice .f3{transform:rotateX(90deg) translateZ(28px)}#dice .f4{transform:rotateX(-90deg) translateZ(28px)}
#dice.can{animation:bob2 .9s ease-in-out infinite;filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 0 4px var(--gold2))}
@keyframes bob2{50%{transform:translateY(-6px)}}
#dice .sh{position:absolute;left:10%;right:10%;bottom:-9px;height:8px;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(3px)}
#st{font-size:13px;color:var(--dim);text-align:center;max-width:55%;line-height:1.3}
#st.me{color:#1c1405;font-weight:800;padding:7px 14px;border-radius:16px;background:linear-gradient(180deg,#ffe27a,#f2b92a);animation:pill 1.1s ease-in-out infinite alternate}
@keyframes pill{to{box-shadow:0 0 16px rgba(242,185,42,.9)}}
#turnb{position:absolute;left:50%;top:44%;z-index:12;transform:translate(-50%,-50%) scale(0);padding:10px 22px;border-radius:26px;background:linear-gradient(180deg,#ffe27a,#f2b92a);color:#1c1405;font-weight:900;font-size:20px;letter-spacing:.5px;pointer-events:none;box-shadow:0 0 28px rgba(242,185,42,.9)}
#cf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
/* ---------- pencereler ---------- */
#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.66);padding:14px;z-index:20}
#modal.on{display:flex}
.box{width:100%;max-width:380px;max-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#221b10,#130f08);border:1px solid var(--gold);border-radius:20px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.65),0 0 24px -6px var(--gold);animation:boxin .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes boxin{from{transform:scale(.8);opacity:0}}
.box h3{margin:0 0 8px;font-size:17px;text-align:center;color:var(--gold2)}
.box p{margin:0 0 10px;color:var(--dim);font-size:13px;text-align:center;line-height:1.4}
.box .btns{margin-top:8px}
.scroll{overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.rules{font-size:13px;line-height:1.5;color:#e6dcc3}
.rules h4{margin:10px 0 4px;color:var(--gold2);font-size:13.5px}
.rules ul{margin:0;padding:0 0 0 18px}.rules li{margin:2px 0}
[dir=rtl] .rules ul{padding:0 18px 0 0}
.rank{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:14px;animation:rin .4s both}
.rank:nth-child(odd){background:rgba(255,255,255,.04)}
.rank.first{background:linear-gradient(90deg,rgba(242,185,42,.32),rgba(242,185,42,.05));border:1px solid rgba(242,185,42,.5)}
.rank .no{width:22px;text-align:center;font-weight:900;color:var(--gold2);font-size:17px}
.rank .av{width:38px;height:38px;font-size:15px;border-color:var(--c,var(--line))}
.rank.first .av{box-shadow:0 0 14px var(--gold)}
.rank .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rank .pt2{font-size:12px;color:var(--dim);white-space:nowrap}
.rank.first .pt2{color:var(--gold2);font-weight:800}
@keyframes rin{from{transform:translateX(-18px);opacity:0}}
.trophy{font-size:54px;text-align:center;line-height:1;margin:2px 0 6px;animation:trophy 1.2s ease-in-out infinite alternate;filter:drop-shadow(0 0 14px rgba(242,185,42,.8))}
@keyframes trophy{from{transform:rotate(-6deg) scale(1)}to{transform:rotate(6deg) scale(1.1)}}
#toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);max-width:88%;padding:7px 15px;border-radius:15px;background:rgba(11,9,6,.94);border:1px solid var(--gold);font-size:12.5px;font-weight:600;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}#toast.bad{border-color:#6b2a24;color:#ff9b93}
#load{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:#0b0906;z-index:40;color:var(--dim);padding:20px;text-align:center}
#load.off{display:none}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head>
<body>
<div id="app" data-room="__ROOM_ID__" data-lang="__LANG__" data-ver="__APP_VERSION__">
  <div class="bar">
    <span class="chip" id="info"></span><span class="sp"></span>
    <button class="ib" id="bleave" aria-label="leave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h10"/></svg></button>

    <button class="ib" id="bmin" aria-label="minimize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <div class="scr" id="lobby">
    <svg class="logoimg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><defs><radialGradient id="lbg" cx="50%" cy="34%" r="75%"><stop offset="0" stop-color="#4a3814"/><stop offset=".55" stop-color="#1d1509"/><stop offset="1" stop-color="#0b0906"/></radialGradient><linearGradient id="lgold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b3"/><stop offset=".5" stop-color="#f2b92a"/><stop offset="1" stop-color="#a8740a"/></linearGradient><linearGradient id="lr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a7e"/><stop offset=".5" stop-color="#e5483d"/><stop offset="1" stop-color="#9c241b"/></linearGradient><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cebad"/><stop offset=".5" stop-color="#2fbf71"/><stop offset="1" stop-color="#157a43"/></linearGradient><linearGradient id="ly" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe89a"/><stop offset=".5" stop-color="#f2b92a"/><stop offset="1" stop-color="#a8740a"/></linearGradient><linearGradient id="lb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93bfff"/><stop offset=".5" stop-color="#3d8bfd"/><stop offset="1" stop-color="#1b4fb0"/></linearGradient><linearGradient id="lw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3d6b4"/></linearGradient></defs><rect x="10" y="10" width="236" height="236" rx="56" fill="url(#lbg)" stroke="url(#lgold)" stroke-width="9"/><rect x="22" y="22" width="212" height="212" rx="45" fill="none" stroke="#f2b92a" stroke-opacity=".28" stroke-width="2"/><g transform="rotate(-10 128 128)"><rect x="58" y="58" width="64" height="64" rx="15" fill="url(#lr)" stroke="#0b0906" stroke-width="4"/><circle cx="90" cy="90" r="15" fill="#fff" fill-opacity=".28"/><circle cx="90" cy="90" r="8" fill="#fff" fill-opacity=".55"/><rect x="134" y="58" width="64" height="64" rx="15" fill="url(#lg)" stroke="#0b0906" stroke-width="4"/><circle cx="166" cy="90" r="15" fill="#fff" fill-opacity=".28"/><circle cx="166" cy="90" r="8" fill="#fff" fill-opacity=".55"/><rect x="58" y="134" width="64" height="64" rx="15" fill="url(#lb)" stroke="#0b0906" stroke-width="4"/><circle cx="90" cy="166" r="15" fill="#fff" fill-opacity=".28"/><circle cx="90" cy="166" r="8" fill="#fff" fill-opacity=".55"/><rect x="134" y="134" width="64" height="64" rx="15" fill="url(#ly)" stroke="#0b0906" stroke-width="4"/><circle cx="166" cy="166" r="15" fill="#fff" fill-opacity=".28"/><circle cx="166" cy="166" r="8" fill="#fff" fill-opacity=".55"/></g><g transform="translate(131 133) rotate(14)"><rect x="-44" y="-40" width="88" height="88" rx="22" fill="#000" fill-opacity=".45"/><rect x="-44" y="-44" width="88" height="88" rx="22" fill="url(#lw)" stroke="url(#lgold)" stroke-width="5"/><circle cx="-22" cy="-22" r="7.5" fill="#1c1405"/><circle cx="22" cy="-22" r="7.5" fill="#1c1405"/><circle cx="0" cy="0" r="7.5" fill="#1c1405"/><circle cx="-22" cy="22" r="7.5" fill="#1c1405"/><circle cx="22" cy="22" r="7.5" fill="#1c1405"/></g><path d="M205 40l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#fff0b3"/></svg>
    <div class="logo">LUDO<small id="ltag"></small></div>
    <div id="lmsg"></div><div id="lcount"></div>
    <div class="modes" id="lmodes"></div>
    <div class="slots" id="lplayers"></div>
    <div class="btns" id="lbtns"></div>
    <button class="link" id="lclose"></button>
  </div>
  <div class="scr" id="board">
    <div id="pl"></div>
    <div id="bwrap"><div id="stage"><div id="bd"></div></div></div>
    <div id="ctl"><button id="dice" aria-label="dice"><div class="tilt"><div class="cube" id="cube"></div></div><div class="sh"></div></button><div id="st"></div></div>

  <div id="turnb"></div>
</div>

<div id="modal"></div>

<script nonce="__NONCE__">
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const app = $('app');
const ROOM = app.dataset.room;

const cf = $('cf'), cx = cf.getContext('2d');

  sizeCf();

  for (let i = 0; i < n; i++) parts.push({ x: x == null ? rnd(0, cf.width) : x, y: y == null ? rnd(-40, 0) : y, vx: rnd(-3, 3) * (x == null ? 0.5 : 1.6), vy: y == null ? rnd(1, 4) : rnd(-9, -3), s: rnd(5, 10), r: rnd(0, 6), vr: rnd(-.3, .3), c: cols[(Math.random() * cols.length) | 0], life: rnd(90, 170) });

}
function cfTick() {
  cx.clearRect(0, 0, cf.width, cf.height);
  parts = parts.filter((p) => p.life > 0 && p.y < cf.height + 20);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.r += p.vr; p.life -= 1;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.min(1, p.life / 30); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.6); cx.restore();

}

let token = null;
let tokenWaiters = [];

function askToken() {
  return new Promise((resolve) => {
    tokenWaiters.push(resolve);
    post({ type: 'getToken' });
    setTimeout(resolve, 4000);
  });
}
async function api(method, path, body, retried) {
  if (!token) await askToken();
  let res;
  try {
    res = await fetch(path, {
      method, cache: 'no-store',
      // Sürüm başlığı uygulamanınkiyle aynı gider (zorunlu güncelleme denetimi API'de bu başlığa bakar).
      headers: Object.assign({ Authorization: 'Bearer ' + (token || ''), 'Content-Type': 'application/json' }, VER ? { 'X-App-Version': VER } : {}),
      body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch (e) { const er = new Error('net'); er.net = true; throw er; }
  if (res.status === 401 && !retried) { token = null; await askToken(); return api(method, path, body, true); }
  let data = null;
  try { data = await res.json(); } catch (_) { /* gövde yok */ }
  if (!res.ok) { const er = new Error((data && data.message) || 'err'); er.status = res.status; throw er; }
  return data;
}
function fail(e) {

}

const PATH = (() => {
  const p = [];
  for (let x = 1; x <= 5; x++) p.push([x, 6]);
  for (let y = 5; y >= 0; y--) p.push([6, y]);
  p.push([7, 0], [8, 0]);
  for (let y = 1; y <= 5; y++) p.push([8, y]);
  for (let x = 9; x <= 14; x++) p.push([x, 6]);
  p.push([14, 7], [14, 8]);
  for (let x = 13; x >= 9; x--) p.push([x, 8]);
  for (let y = 9; y <= 14; y++) p.push([8, y]);
  p.push([7, 14], [6, 14]);
  for (let y = 13; y >= 9; y--) p.push([6, y]);
  for (let x = 5; x >= 0; x--) p.push([x, 8]);
  p.push([0, 7], [0, 6]);
  return p;
})();

    const id = p.seat + ':' + i; live.add(id);
    let e = bd.querySelector('[data-t="' + id + '"]');
    if (!e) { e = el('button', 'tk s' + p.seat); e.innerHTML = tokenSvg(p.seat); e.dataset.t = id; bd.appendChild(e); shown[id] = pr; place(e, p.seat, pr, i, stackOf[id]); e.addEventListener('click', () => moveToken(p.seat, i)); }
    const ok = p.seat === (me && me.seat) && legal.includes(i);
    e.classList.toggle('ok', ok);
    if (ok) {
      const to = targetOf(p.seat, pr, G.dice);
      if (to != null && to !== pr) {
        const gh = el('button', 'gh s' + p.seat); place(gh, p.seat, to, i, null); gh.addEventListener('click', () => moveToken(p.seat, i)); bd.appendChild(gh);
      }
    }
    const from = shown[id];
    if (from === pr) { place(e, p.seat, pr, i, stackOf[id]); return; }
    // Yakalanan taş: üssüne dönmeden önce patlama.
    if (from >= 0 && pr === -1) { const c0 = center(p.seat, from, i); burst(c0[0], c0[1], COL[p.seat], 18); ripple(c0[0], c0[1], COL[p.seat]); shake(); post({ type: 'haptic' }); }
    // Kısa ileri hamle kare kare yürütülür (zıplayarak); yakalanma, kapı, bomba ve tur dönüşü doğrudan konulur.
    if (from >= 0 && pr > from && pr - from <= 6) {
      let cur = from;
      const stepper = () => {
        if (gen !== walkGen) return;
        cur += 1; shown[id] = cur; place(e, p.seat, cur, i, cur === pr ? stackOf[id] : null); hop(e);
        if (cur < pr) setTimeout(stepper, 150);
        else { const c1 = center(p.seat, pr, i); ripple(c1[0], c1[1], COL[p.seat]); if (pr === 56) { burst(c1[0], c1[1], '#ffd54f', 24); confetti(50); } }
      };
      stepper();
    } else { shown[id] = pr; place(e, p.seat, pr, i, stackOf[id]); if (from === -1 && pr === 0) { hop(e); ripple(center(p.seat, 0, i)[0], center(p.seat, 0, i)[1], COL[p.seat]); } }
  });
  bd.querySelectorAll('.tk').forEach((e) => { if (!live.has(e.dataset.t)) { delete shown[e.dataset.t]; e.remove(); } });
}
function renderPlayers() {
  const box = $('pl'); box.textContent = '';
  for (const p of G.players) {
    const d = el('div', 'pc s' + p.seat + (G.turnSeat === p.seat ? ' turn' : ''));
    d.dataset.seat = String(p.seat);
    const rg = el('div', 'rg'); rg.appendChild(avatar(p.user));
    const tx = el('div', 'tx'); const dots = el('div', 'dots');
    (G.tokens[p.seat] || [-1, -1, -1, -1]).forEach((pr) => dots.appendChild(el('i', pr === 56 ? 'on' : '')));
    tx.append(el('span', 'nm', nameOf(p)), dots);
    d.append(rg, tx);
    if ((G.frozen || []).includes(p.seat)) d.appendChild(el('span', 'bd', '❄️'));
    if (G.mode === 'quick') d.appendChild(el('span', 'kl', '⚔ ' + ((G.kills && G.kills[p.seat]) || 0)));
    box.appendChild(d);
  }
}
function renderCtl() {
  const me = G.me && G.me.joined ? G.me : null;
  const myTurn = !!(me && G.status === 'playing' && G.turnSeat === me.seat);
  const dice = $('dice'), st = $('st');
  const lastLog = (G.log || []).slice().reverse().find((e) => e.dice);
  const rolled = G.dice != null ? G.dice : (lastLog ? lastLog.dice : null);
  const roller = G.dice != null ? G.turnSeat : (lastLog ? lastLog.seat : G.turnSeat);
  dice.style.setProperty('--dc', COL[roller] || '#c98a08');
  if (rolled) {
    // Zar yalnızca atış anında (yeni zar ya da "hamle yok" kaydı) döner; hamle sonrası aynı yüz kalır.
    const fresh = (G.dice != null && G.seq !== lastRollSeq) || (lastLog && (lastLog.event === 'no_move' || lastLog.event === 'three_sixes') && lastLog.n > lastRollSeq);
    if (!diceReady) diceSet(rolled);
    else if (fresh) diceTo(rolled, 1);
    if (fresh || !diceReady) lastRollSeq = Math.max(G.seq, lastRollSeq);
    diceReady = true;
  } else if (!diceReady) { diceSet(1); diceReady = true; }
  dice.className = myTurn && G.dice == null ? 'can' : '';
  st.dir = RTL ? 'rtl' : 'ltr';
  st.className = myTurn ? 'me' : '';
  const cur = G.players.find((p) => p.seat === G.turnSeat);
  st.textContent = G.status !== 'playing' ? '' : myTurn ? (G.dice == null ? t('yourRoll') : t('yourMove')) : me ? t('turnOf', { n: nameOf(cur) }) : t('watching') + ' · ' + t('turnOf', { n: nameOf(cur) });
}
async function rollDice() {
  const me = G && G.me && G.me.joined ? G.me : null;
  if (!me || busy || G.status !== 'playing' || G.turnSeat !== me.seat || G.dice != null) return;
  const gid = G.id;
  $('dice').className = '';
  diceSpin();
  post({ type: 'haptic' });
  const d = await act(() => api('POST', '/api/games/' + gid + '/roll'));
  // Tek hamle varsa kendiliğinden oynanır (seçilecek bir şey yok).
  if (d && !d.skipped && d.legal && d.legal.length === 1) setTimeout(() => moveToken(me.seat, d.legal[0]), 900);
}
function moveToken(seat, tok) {
  const me = G && G.me && G.me.joined ? G.me : null;
  if (!me || busy || seat !== me.seat || G.status !== 'playing' || G.turnSeat !== me.seat || G.dice == null || !(G.legal || []).includes(tok)) return;
  const gid = G.id;
  act(() => api('POST', '/api/games/' + gid + '/move', { token: tok }));
}
function events(was) {
  if (seenGame === G.id && G.seq <= seenSeq) return;
  const first = seenGame !== G.id, since = seenSeq;
  seenGame = G.id; seenSeq = G.seq;
  if (first) return;
  const name = (seat) => nameOf(G.players.find((p) => p.seat === seat) || (was && was.players.find((p) => p.seat === seat)));
  const msgs = [];
  for (const e of G.log || []) {
    if (!(e.n > since)) continue;
    if (e.event === 'three_sixes') msgs.push(t('eSix3', { n: name(e.seat) }));
    else if (e.event === 'no_move') msgs.push(t('eNoMove', { n: name(e.seat) }));
    else if (e.event === 'frozen_skip') msgs.push(t('eFrozen', { n: name(e.seat) }));
    else if (e.event === 'forfeit') msgs.push(t('eLeft', { n: name(e.seat) }));
    else {
      const f = (e.fx || [])[0];
      if (f) {
        msgs.push(t({ bomb: 'eBomb', portal: 'ePortal', rocket: 'eRocket', ice: 'eIce', dice: 'eDice' }[f.item], { n: name(e.seat) }));
        if (e.land != null && e.land >= 0 && e.land <= 50) { const c = center(e.seat, e.land, 0); popText(c[0], c[1], ICON[f.item] || '✨'); if (f.item === 'bomb') { burst(c[0], c[1], '#ff9b3d', 22); shake(); } else ripple(c[0], c[1], '#ffd54f'); }
      } else if (e.event === 'capture') msgs.push(t('eCapture', { n: name(e.seat) }));
      else if (e.event === 'finish') msgs.push(t('eHome', { n: name(e.seat) }));
    }
  }
  if (msgs.length) toast(msgs.slice(-2).join(' · '));
}
function renderBoard(was) {
  show('board');
  const me = G.me && G.me.joined ? G.me : null;
  $('info').style.display = ''; $('info').textContent = MODE_ICON[G.mode || 'classic'] + ' ' + t(G.mode || 'classic');
  $('bleave').style.display = me && G.status === 'playing' ? '' : 'none';
  events(was);
  buildBoard(); renderPlayers(); renderTokens(); renderCtl();
  const mine = !!(me && G.status === 'playing' && G.turnSeat === me.seat);
  if (mine && !prevTurnMine) { post({ type: 'haptic' }); turnBanner(t('yourTurnB')); }
  prevTurnMine = mine;
}
function render(was) {
  if (G && G.status === 'playing') { if (modalKind === 'result') closeModal(); renderBoard(was); return; }
  if (G && G.status === 'finished') {
    if (closedResult === G.id) { G = null; renderLobby(); return; }
    if (G.tokens && (was && was.id === G.id && was.status === 'playing' || $('board').classList.contains('on'))) renderBoard(was); else renderLobby();
    if (modalKind !== 'result') showResult();
    return;
  }
  if (G && G.status === 'cancelled') { if (was && was.id === G.id && was.status !== 'cancelled') toast(t('cancelled')); G = null; }
  if (modalKind === 'result' && G) closeModal();
  prevTurnMine = false; diceReady = false; lastRollSeq = -1; builtFor = null;
  renderLobby();
}
setInterval(() => {
  if (!G || G.status !== 'playing' || !turnEnd) return;
  const b = document.querySelector('.pc.turn .rg');
  if (b) b.style.setProperty('--p', String(Math.max(0, Math.min(1, (turnEnd - performance.now()) / (G.turnMs || 30000)))));
}, 120);

// ---------- olaylar ----------
$('brules').addEventListener('click', showRules);
$('bmin').addEventListener('click', () => post({ type: 'minimize' }));
$('bleave').addEventListener('click', () => { if (!G) return; const gid = G.id; confirmBox(t('leaveQ'), t('leaveHint'), t('leave'), () => act(() => api('POST', '/api/games/' + gid + '/leave'))); });
$('dice').addEventListener('click', rollDice);
window.addEventListener('resize', () => { sizeCf(); if (G && G.tokens && $('board').classList.contains('on')) { buildBoard(); renderTokens(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
setInterval(() => { if (document.visibilityState === 'visible' && !busy) refresh(); }, 4000);

(async () => {
  $('loadmsg').textContent = t('loading');
  sizeCf();
  if (!window.TRLive) { $('load').querySelector('.spin').remove(); $('loadmsg').textContent = t('appOnly'); return; }
  await refresh();
  $('load').className = 'off';
  post({ type: 'ready' });
})();
})();
</script>
