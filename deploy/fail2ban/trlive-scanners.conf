# 444: nginx'in tarayıcı yolları (.env, wp-login ...) için kestiği bağlantılar.
# 403 bilerek SAYILMAZ: uygulamanın olağan yanıtıdır (yetkisiz işlem, odadan düşmüş üyelik, engellenen kullanıcı).
# Sayıldığında 10 dakikada beş 403 alan sıradan bir kullanıcı ağ düzeyinde 24 saat engelleniyordu.
[Definition]
failregex = ^<HOST> .* "(GET|POST|HEAD) [^"]*" 444 .*$
ignoreregex =
