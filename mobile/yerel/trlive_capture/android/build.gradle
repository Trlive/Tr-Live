group = "com.trlive.trlive_capture"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.trlive.trlive_capture"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk = 21
    }
}

// Yayın derlemesinde Android "lint vital" denetimi atlanır. Bu adım APK'yı değiştirmez; yalnızca derlemeden önce ek
// bir kontrol yapar. Son derlemelerde lint aracının kendisi çökerek (LintDriver.handleDetectorError) derlemeyi
// durdurduğu için kapatıldı. Dart kod analizi (flutter analyze) iş akışında ayrıca çalışmaya devam eder.
rootProject.allprojects { p ->
    p.tasks.matching { it.name.startsWith("lintVital") }.configureEach { t ->
        t.enabled = false
    }
}
