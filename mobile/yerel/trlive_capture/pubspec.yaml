name: trlive_capture
description: TR Live için Android izin bildirimi (ekran görüntüsü algılama). Yalnızca AndroidManifest izni taşır.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.trlive.trlive_capture
        pluginClass: TrliveCapturePlugin
