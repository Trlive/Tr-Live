name: tr_live
description: TR Live - canlı sesli/görüntülü odalar, aile, WIP, ajans/yayıncı, hediyeler ve yönetim
publish_to: none
version: 2.154.2+116
environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.5.3
  # 2.13.2: flutter_webrtc 1.6.3 (gürültü azaltma eklentisinin istediği sürüm; ayrıca TURN/TLS güvenlik düzeltmesi).
  livekit_client: ^2.13.2
  web_socket_channel: ^3.0.3
  lottie: ^3.3.1
  # Yerel kopya (0.1.2): VAP kendi sesini çalmasın diye sessize alındı (yerel/flutter_vap_kit).
  flutter_vap_kit:
    path: yerel/flutter_vap_kit
  flutter_foreground_task: ^11.0.1
  just_audio: ^0.10.4
  file_picker: ^8.1.2
  image_picker: ^1.2.0
  # Kırpılan fotoğrafı JPEG'e çevirmek için (saf Dart; yerel kod eklemez).
  image: ^4.2.0
  # livekit_client zaten bu paketi kullanıyor; 'any' aynı sürümü seçer (yeni yerel kod eklenmez).
  device_info_plus: any
  # Telefon araması gelince oda sesini kapatmak için. just_audio zaten bu paketi kullanıyor (yeni yerel kod eklenmez).
  audio_session: any
  # Mikrofon ses işleme yöntemi (services/audio_processing.dart). livekit_client zaten bu paketi kullanıyor; 'any' aynı sürüm.
  flutter_webrtc: any
  # KALDIRILDI: flutter_webrtc_noise_suppression (yapay zekâ gürültü azaltma, RNNoise).
  #
  # Kaynak depo (github.com/SERDUN/flutter_webrtc_noise_suppression) artık erişilemiyor:
  # anonim `git clone` kimlik doğrulaması istiyor, yani depo silinmiş ya da özel yapılmış.
  # Sonuç: her APK derlemesi `flutter pub get` adımında kırılıyordu — bağımlılık indirilemediği
  # için derleme hiç başlayamıyordu.
  #
  # Üretim derlemesini kontrolümüz dışındaki kişisel bir depoya bağlamak baştan kırılgandı.
  # Buraya yeni bir git bağımlılığı eklenecekse: ya yayımlanmış (pub.dev) bir paket olmalı,
  # ya da bizim denetimimizdeki bir depodan ve SABİT bir commit'e (ref:) kilitlenmiş olmalı.
  #
  # Yerine ne var: WebRTC'nin kendi gürültü bastırması ve ses yalıtımı oda ekranında zaten açık.
  # services/denoiser.dart yerinde duruyor ama devre dışı; eklenti geri gelirse tek yerden açılır.
  cupertino_icons: ^1.0.8
  # Yönetimden herkese telefon bildirimi (Firebase gerektirmez). Sürüm sabit: API'si bu sürüme göre yazıldı.
  flutter_local_notifications: 19.5.0
  # Google / Facebook girişi için giriş sayfasını tarayıcıda açar.
  url_launcher: ^6.3.1
  # Oda içi etkinlikler / oyunlar için kendi sunucumuzdaki sabit H5 sayfasını gösterir (widgets/app_webview_modal.dart).
  webview_flutter: ^4.13.0
  # Android 14+ ekran görüntüsü bildirimi izni (yerel/trlive_capture: yalnızca manifest izni).
  trlive_capture:
    path: yerel/trlive_capture
  # Telefon doğrulaması (SMS kodu): Firebase Authentication. google-services.json gerekmez; Firebase ayarları
  # sunucudan (/api/app/config) gelir ve uygulama açıkken başlatılır. Flutter BoM 4.x (kararlı) serisi.
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  flutter_secure_storage: ^10.3.4
# shared_preferences_android 2.5.0 (16 Ekim 2026) yeni JNI yöntemine geçti; yayın APK'sında küçültme (R8) yüzünden
# "NoSuchMethodError ... SharedPreferencesApiRegistrar.getAll" ile açılışta çöküyor. Sorunsuz son yayınlanmış sürüme (2.4.28) sabitlendi.
dependency_overrides:
  shared_preferences_android: 2.4.28
  # Bilinen sorunsuz son sürüm (yeni sürümler JNI'ye geçerse aynı açılış çökmesi olmasın).
  url_launcher_android: 6.3.33
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_secure_storage_platform_interface: ^2.1.1
flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
    - assets/figma/
